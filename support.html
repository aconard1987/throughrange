<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughrange Support</title>
<style>
:root { --bg: #ece3d3; --card: #f6f0e6; --text: #2b2724; --dim: #6f675f; --rule: #d9cfbf; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); }
h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin: 10px 0 24px; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 0 0 28px; }
p { color: var(--dim); margin: 0 0 18px; }
.lead { font-size: 25px; line-height: 1.35; font-weight: 500; margin: 0 0 20px; color: var(--text); }
a { color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="kicker">Throughrange</div>
  <h1>Support</h1>
  <hr>
  <p class="lead">Questions or problems? Email us.</p>
  <p><a href="mailto:alex@anamara.app">alex@anamara.app</a></p>
  <p><a href="privacy.html">Privacy Policy</a></p>
